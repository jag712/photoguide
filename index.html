<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="사진의 구조, 노출, 조명 등을 배우는 쮸쀼의 비밀교실" />
    <meta name="theme-color" content="#ffffff" />
    <title>쮸쀼의 비밀교실 (✨)</title>

    <link rel="icon" href="/notime.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/notime.ico" type="image/x-icon" />
    <link rel="manifest" href="manifest.json" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jamo-js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="antialiased">
    <div class="flex flex-col md:flex-row min-h-screen">
      <nav
        class="w-full md:w-72 bg-white p-6 md:p-8 border-b md:border-b-0 md:border-r border-[#e8e1d2] shrink-0 z-10 md:fixed md:h-screen md:overflow-y-auto"
      >
        <a
          href="#"
          id="homeLink"
          data-category="home"
          class="flex items-center gap-3 mb-8 cursor-pointer"
        >
          <span class="flex items-center justify-center w-9 h-9 rounded-full" style="background-color:#f3e4d3;">
            <i class="fas fa-camera-retro text-sm" style="color:#8a3f16;"></i>
          </span>
          <h1 class="brand-title text-lg text-[#2b2924]">쮸쀼의 비밀교실</h1>
        </a>
        <div class="mb-6">
          <div class="relative">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-xs text-[#a49c88]"></i>
            <input
              type="text"
              id="searchInput"
              placeholder="용어 검색..."
              class="w-full pl-9 pr-4 py-2.5 border border-[#e8e1d2] rounded-lg bg-[#faf7f2] text-sm focus:outline-none focus:ring-2 focus:ring-[#e8c9a8] focus:border-[#b8551f]"
            />
          </div>
        </div>
        <div class="text-xs tracking-wide text-[#a49c88] mb-3 px-4">MENU</div>
        <ul>
          <li>
            <a
              href="#"
              class="nav-item block py-3 px-4 mb-1 rounded-r-lg text-sm font-medium text-gray-700 active"
              data-category="home"
              >남은 일정</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-item block py-3 px-4 mb-1 rounded-r-lg text-sm font-medium text-gray-700"
              data-category="visualization"
              >시각화</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-item block py-3 px-4 mb-1 rounded-r-lg text-sm font-medium text-gray-700"
              data-category="studyNotes"
              >학습 노트</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-item block py-3 px-4 mb-1 rounded-r-lg text-sm font-medium text-gray-700"
              data-category="cms"
              >CMS 가이드</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-item block py-3 px-4 mb-1 rounded-r-lg text-sm font-medium text-gray-700"
              data-category="structure"
              >해메띾 구조와 원릡</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-item block py-3 px-4 mb-1 rounded-r-lg text-sm font-medium text-gray-700"
              data-category="exposure"
              >노출</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-item block py-3 px-4 mb-1 rounded-r-lg text-sm font-medium text-gray-700"
              data-category="lenns"
              >렌즈와 광학</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-item block py-3 px-4 mb-1 rounded-r-lg text-sm font-medium text-gray-700"
              data-category="digital"
              >디지털</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-item block py-3 px-4 mb-1 rounded-r-lg text-sm font-medium text-gray-700"
              data-category="film"
              >필름 현상 인화</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-item block py-3 px-4 mb-1 rounded-r-lg text-sm font-medium text-gray-700"
              data-category="lighting"
              >조명과 필터</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-item block py-3 px-4 mb-1 rounded-r-lg text-sm font-medium text-gray-700"
              data-category="history"
              >사진사 & 사조</a
            >
          </li>
          <li>
            <a
              href="#"
              class="nav-item block py-3 px-4 mb-1 rounded-r-lg text-sm font-medium text-gray-700"
              data-category="quiz"
              >퀴즈</a
            >
          </li>
        </ul>
      </nav>

      <main
        id="mainContent"
        class="flex-1 p-4 md:p-12 md:ml-72 overflow-y-auto"
      ></main>
    </div>

    <div
      id="geminiModal"
      class="modal-overlay fixed inset-0 flex items-center justify-center p-4 z-50 hidden opacity-0"
    >
      <div
        class="modal-content bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[80vh] flex flex-col transform scale-95 border border-[#e8e1d2]"
      >
        <div class="flex justify-between items-center p-5 border-b border-[#e8e1d2]">
          <h3 id="modalTitle" class="brand-title text-lg text-[#2b2924]">
            Gemini AI
          </h3>
          <button
            id="closeModal"
            class="text-[#a49c88] hover:text-[#2b2924] text-2xl font-bold"
          >
            &times;
          </button>
        </div>
        <div id="modalBody" class="p-6 overflow-y-auto"></div>
      </div>
    </div>

    <script src="photographyData.js"></script>
    <script src="interviewQuestions.js"></script>
    <script src="scoring.js"></script>
    <script src="main.js"></script>
  </body>
</html>
